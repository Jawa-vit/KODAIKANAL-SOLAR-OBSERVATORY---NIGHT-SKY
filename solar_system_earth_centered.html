<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System 3D - Earth Centered</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Orbitron', monospace; background: #000; color: white; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .header { position: fixed; top: 0; left: 0; right: 0; padding: 20px 40px; background: linear-gradient(180deg, rgba(10,15,35,0.98) 0%, transparent 100%); backdrop-filter: blur(15px); z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(100,150,255,0.3); }
        .header h1 { font-size: 2em; font-weight: 900; letter-spacing: 5px; background: linear-gradient(135deg, #FDB813, #FF8C00, #FDB813); background-size: 200% 200%; animation: gradientShift 3s ease infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .live-indicator { display: flex; align-items: center; gap: 8px; color: #4FD0E7; font-size: 0.85em; }
        .live-dot { width: 8px; height: 8px; background: #4FD0E7; border-radius: 50%; animation: pulse 2s ease infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
        .time-display { font-size: 1.1em; color: #FDB813; font-family: 'Space Mono', monospace; font-weight: 700; }
        .search-bar { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); z-index: 999; width: 500px; }
        .search-input { width: 100%; padding: 15px 50px 15px 20px; background: rgba(15,25,50,0.95); border: 2px solid rgba(100,150,255,0.4); border-radius: 30px; color: #A8B8FF; font-family: 'Space Mono', monospace; font-size: 0.9em; outline: none; transition: all 0.3s; }
        .search-input:focus { border-color: #FDB813; box-shadow: 0 0 20px rgba(253,184,19,0.3); }
        .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #4FD0E7; font-size: 1.2em; }
        .info-panel { position: fixed; bottom: 20px; left: 20px; background: rgba(15,25,50,0.95); backdrop-filter: blur(20px); border: 2px solid rgba(100,150,255,0.4); border-radius: 15px; padding: 25px; max-width: 600px; z-index: 999; max-height: 450px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .info-panel h3 { color: #FDB813; font-size: 1.4em; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .info-item { font-size: 0.75em; color: #A8B8FF; font-family: 'Space Mono', monospace; background: rgba(100,130,255,0.12); padding: 10px; border-radius: 8px; border-left: 3px solid rgba(79,208,231,0.6); transition: all 0.3s; }
        .info-item:hover { background: rgba(100,130,255,0.2); border-left-color: #FDB813; }
        .info-item strong { color: #FDB813; display: block; margin-bottom: 4px; font-size: 1.05em; }
        .info-fact { margin-top: 15px; padding-top: 15px; border-top: 2px solid rgba(100,150,255,0.3); font-size: 0.8em; color: rgba(168,184,255,0.95); font-family: 'Space Mono', monospace; line-height: 1.6; }
        .data-source { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,25,50,0.95); border: 2px solid rgba(253,184,19,0.5); border-radius: 25px; padding: 12px 25px; font-size: 0.8em; color: #FDB813; display: flex; align-items: center; gap: 10px; z-index: 998; }
        .rocket-icon { font-size: 1.2em; animation: rocket 2s ease-in-out infinite; }
        @keyframes rocket { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .controls-panel { position: fixed; top: 90px; right: 20px; background: rgba(15,25,50,0.95); border: 2px solid rgba(100,150,255,0.4); border-radius: 15px; padding: 20px; z-index: 999; width: 200px; }
        .controls-title { color: #4FD0E7; font-size: 1em; margin-bottom: 15px; text-align: center; font-weight: 700; }
        .cam-control { margin-bottom: 12px; }
        .cam-label { color: #A8B8FF; font-size: 0.7em; margin-bottom: 5px; font-family: 'Space Mono', monospace; }
        .cam-slider { width: 100%; height: 4px; background: rgba(100,130,255,0.3); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .cam-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #FDB813; border-radius: 50%; cursor: pointer; }
        .btn { width: 100%; background: rgba(100,130,255,0.15); color: #4FD0E7; border: 2px solid rgba(100,150,255,0.5); padding: 10px; border-radius: 8px; font-size: 0.65em; cursor: pointer; margin-bottom: 8px; font-family: 'Orbitron', monospace; transition: all 0.3s; font-weight: 700; letter-spacing: 1px; }
        .btn:hover { background: rgba(100,130,255,0.3); border-color: #FDB813; color: #FDB813; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(253,184,19,0.3); }
        .btn.active { background: rgba(79,208,231,0.3); border-color: #4FD0E7; color: #FFF; }
        .objects-panel { position: fixed; top: 90px; right: 240px; background: rgba(15,25,50,0.95); border: 2px solid rgba(100,150,255,0.4); border-radius: 15px; padding: 20px; z-index: 999; width: 200px; max-height: 600px; overflow-y: auto; }
        .objects-title { color: #FDB813; font-size: 1em; margin-bottom: 15px; text-align: center; font-weight: 700; }
        .object-category { margin-bottom: 15px; }
        .category-title { color: #4FD0E7; font-size: 0.75em; margin-bottom: 8px; font-weight: 700; }
        .object-btn { width: 100%; background: rgba(100,130,255,0.08); color: #A8B8FF; border: 1px solid rgba(100,150,255,0.3); padding: 8px; border-radius: 6px; font-size: 0.65em; cursor: pointer; margin-bottom: 5px; font-family: 'Space Mono', monospace; text-align: left; transition: all 0.2s; }
        .object-btn:hover { background: rgba(100,130,255,0.2); border-color: #FDB813; color: #FDB813; transform: translateX(5px); }
        .info-panel::-webkit-scrollbar, .objects-panel::-webkit-scrollbar { width: 6px; }
        .info-panel::-webkit-scrollbar-track, .objects-panel::-webkit-scrollbar-track { background: rgba(100,130,255,0.1); }
        .info-panel::-webkit-scrollbar-thumb, .objects-panel::-webkit-scrollbar-thumb { background: rgba(253,184,19,0.5); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="header">
        <h1>⚡ SOLAR SYSTEM 3D ⚡</h1>
        <div class="header-right">
            <div class="live-indicator"><div class="live-dot"></div><span>LIVE ORBITS & STARS</span></div>
            <div class="time-display" id="time-display">Loading...</div>
        </div>
    </div>
    <div class="search-bar">
        <input type="text" class="search-input" placeholder="🔍 Search planets & stars..." id="search-input">
        <span class="search-icon">🔎</span>
    </div>
    <div class="controls-panel">
        <div class="controls-title">⚙ CONTROLS</div>
        <div class="cam-control">
            <div class="cam-label">CAM FOV: <span id="fov-value">60°</span></div>
            <input type="range" class="cam-slider" id="fov-slider" min="30" max="120" value="60">
        </div>
        <button class="btn active" id="orbit-btn" onclick="toggleOrbits()">ORBITS ON</button>
        <button class="btn active" id="stars-btn" onclick="toggleStars()">STARS ON</button>
        <button class="btn" onclick="resetCamera()">RESET</button>
    </div>
    <div class="objects-panel">
        <div class="objects-title">📍 OBJECTS</div>
        <div class="object-category">
            <div class="category-title">PLANETS</div>
            <div id="planets-list"></div>
        </div>
        <div class="object-category">
            <div class="category-title">STARS</div>
            <div id="stars-list"></div>
        </div>
    </div>
    <div class="info-panel">
        <h3 id="planet-name">🌍 EARTH</h3>
        <div class="info-grid" id="info-grid"></div>
        <div class="info-fact" id="planet-fact">Click any celestial object to view comprehensive real-time data!</div>
    </div>
    <div class="data-source">
        <span class="rocket-icon">🚀</span>
        <span>Data Source: NASA</span>
        <span style="color: #4FD0E7;">Planetary & Astronomical Data</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
let scene,camera,renderer,planets={},stars={},orbitLines=[],showOrbits=true,showStars=true,animationSpeed=1000,startTime=Date.now(),raycaster,mouse;

const planetsData={Sun:{period:365.25,distance:8,fromEarthAU:1.0,fromEarthKM:149600000,size:0.4,color:0xFDB813,emissive:0xFDB813,emissiveIntensity:1,startAngle:180,radius:696340,mass:'1.989×10³⁰ kg',gravity:274,temperature:5505,rotationPeriod:27,moons:0,type:'G-type Star',atmosphere:'73% H, 25% He'},Mercury:{period:87.97,distance:4.5,fromEarthAU:0.61,fromEarthKM:91700000,size:0.08,color:0x8C7853,emissive:0x8C7853,emissiveIntensity:0.2,startAngle:320,radius:2439.7,mass:'3.285×10²³ kg',gravity:3.7,temperature:167,rotationPeriod:58.646,moons:0,type:'Terrestrial',atmosphere:'Trace'},Venus:{period:224.7,distance:6.5,fromEarthAU:0.28,fromEarthKM:41400000,size:0.12,color:0xFFC649,emissive:0xFFC649,emissiveIntensity:0.3,startAngle:135,radius:6051.8,mass:'4.867×10²⁴ kg',gravity:8.87,temperature:464,rotationPeriod:243,moons:0,type:'Terrestrial',atmosphere:'96.5% CO₂'},Mars:{period:686.98,distance:11,fromEarthAU:0.52,fromEarthKM:78340000,size:0.1,color:0xE27B58,emissive:0xE27B58,emissiveIntensity:0.2,startAngle:90,radius:3389.5,mass:'6.39×10²³ kg',gravity:3.71,temperature:-65,rotationPeriod:1.026,moons:2,type:'Terrestrial',atmosphere:'95% CO₂'},Jupiter:{period:4332.59,distance:16,fromEarthAU:4.2,fromEarthKM:628730000,size:0.32,color:0xC88B3A,emissive:0xC88B3A,emissiveIntensity:0.3,startAngle:250,radius:69911,mass:'1.898×10²⁷ kg',gravity:24.79,temperature:-110,rotationPeriod:0.414,moons:95,type:'Gas Giant',atmosphere:'90% H₂'},Saturn:{period:10759.22,distance:20,fromEarthAU:8.54,fromEarthKM:1277130000,size:0.28,color:0xFAD5A5,emissive:0xFAD5A5,emissiveIntensity:0.2,startAngle:10,radius:58232,mass:'5.683×10²⁶ kg',gravity:10.44,temperature:-140,rotationPeriod:0.445,moons:146,type:'Gas Giant',atmosphere:'96% H₂'},Uranus:{period:30688.5,distance:24,fromEarthAU:18.2,fromEarthKM:2721400000,size:0.2,color:0x4FD0E7,emissive:0x4FD0E7,emissiveIntensity:0.3,startAngle:170,radius:25362,mass:'8.681×10²⁵ kg',gravity:8.69,temperature:-195,rotationPeriod:0.718,moons:27,type:'Ice Giant',atmosphere:'83% H₂'},Neptune:{period:60182,distance:28,fromEarthAU:29.1,fromEarthKM:4351400000,size:0.19,color:0x4166F5,emissive:0x4166F5,emissiveIntensity:0.3,startAngle:45,radius:24622,mass:'1.024×10²⁶ kg',gravity:11.15,temperature:-200,rotationPeriod:0.671,moons:14,type:'Ice Giant',atmosphere:'80% H₂'},Moon:{period:27.32,distance:1.2,fromEarthAU:0.00257,fromEarthKM:384400,size:0.06,color:0xD3D3D3,emissive:0xD3D3D3,emissiveIntensity:0.2,startAngle:0,radius:1737.4,mass:'7.342×10²² kg',gravity:1.62,temperature:-53,rotationPeriod:27.32,moons:0,type:'Satellite',atmosphere:'None'}};

const starsData={Sirius:{ra:101.287,dec:-16.716,distance:32,fromEarthLY:8.6,fromEarthKM:81360000000000,size:0.16,color:0xFFFFFF,magnitude:-1.46,spectralType:'A1V',mass:'2.06 M☉',temperature:9940,luminosity:'25.4 L☉',constellation:'Canis Major'},Canopus:{ra:95.988,dec:-52.696,distance:36,fromEarthLY:310,fromEarthKM:2932600000000000,size:0.14,color:0xFFFFAA,magnitude:-0.74,spectralType:'A9II',mass:'8 M☉',temperature:7350,luminosity:'10,700 L☉',constellation:'Carina'},'Alpha Centauri':{ra:219.901,dec:-60.834,distance:28,fromEarthLY:4.37,fromEarthKM:41343000000000,size:0.13,color:0xFFFFDD,magnitude:-0.27,spectralType:'G2V',mass:'1.1 M☉',temperature:5790,luminosity:'1.5 L☉',constellation:'Centaurus'},Arcturus:{ra:213.915,dec:19.182,distance:38,fromEarthLY:36.7,fromEarthKM:347100000000000,size:0.15,color:0xFFCC66,magnitude:-0.05,spectralType:'K1.5III',mass:'1.08 M☉',temperature:4290,luminosity:'170 L☉',constellation:'Boötes'},Vega:{ra:279.234,dec:38.783,distance:30,fromEarthLY:25,fromEarthKM:236500000000000,size:0.14,color:0xE8F4FF,magnitude:0.03,spectralType:'A0V',mass:'2.14 M☉',temperature:9602,luminosity:'40.1 L☉',constellation:'Lyra'},Capella:{ra:79.172,dec:45.998,distance:34,fromEarthLY:42.9,fromEarthKM:405900000000000,size:0.13,color:0xFFF4E6,magnitude:0.08,spectralType:'G8III',mass:'2.57 M☉',temperature:4970,luminosity:'79 L☉',constellation:'Auriga'},Rigel:{ra:78.634,dec:-8.202,distance:40,fromEarthLY:860,fromEarthKM:8136800000000000,size:0.15,color:0xB0D4FF,magnitude:0.13,spectralType:'B8Ia',mass:'21 M☉',temperature:11000,luminosity:'120,000 L☉',constellation:'Orion'},Procyon:{ra:114.826,dec:5.225,distance:26,fromEarthLY:11.46,fromEarthKM:108410000000000,size:0.12,color:0xFFFBF0,magnitude:0.34,spectralType:'F5IV',mass:'1.5 M☉',temperature:6530,luminosity:'6.93 L☉',constellation:'Canis Minor'}};

const planetFacts={Mercury:'⚡ Smallest planet, fastest orbit (47.87 km/s)! Extreme temps: -173°C to 427°C.',Venus:'🔥 Hottest planet (464°C)! Rotates backwards. Day longer than year!',Mars:'🏔️ Red Planet! Olympus Mons: tallest volcano (21.9 km). Two moons!',Jupiter:'🌪️ Largest planet! 1,300 Earths fit inside. Great Red Spot storm. 95 moons!',Saturn:'💍 Famous rings (282,000 km wide)! 146 moons. Hexagonal storm!',Uranus:'🧊 Sideways planet (98° tilt). Coldest atmosphere (-224°C). 42-year seasons!',Neptune:'💨 Windiest planet (2,100 km/h)! Deep blue from methane.',Moon:'🌙 Earth\'s companion. Tidally locked. Causes tides. Moving away 3.8 cm/year!',Sun:'⭐ Our star! 99.86% of solar system mass. Core: 15 million°C!',Sirius:'✨ Brightest star! Binary system with white dwarf.',Canopus:'✨ Second brightest star! Supergiant nearing end of life.','Alpha Centauri':'✨ Closest star system! Has potentially habitable exoplanet!',Arcturus:'✨ Red giant! 170× brighter than Sun. Moving at 122 km/s!',Vega:'✨ Fifth brightest! Was North Star 14,000 years ago.',Capella:'✨ Actually four stars orbiting each other!',Rigel:'✨ Blue supergiant! 120,000× brighter than Sun!',Procyon:'✨ Binary system. Part of Winter Triangle.'};

function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,20,30);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();createStarfield();createEarth();createPlanets();createStars();createOrbitLines();populateObjectsList();scene.add(new THREE.AmbientLight(0xffffff,0.3));scene.add(new THREE.PointLight(0xffffff,1.5,100));setupControls();setupFOVControl();setupSearch();window.addEventListener('resize',onWindowResize);window.addEventListener('click',onObjectClick);window.addEventListener('mousemove',onMouseMove);showObjectInfo({name:'Earth',type:'planet'});animate()}

function createStarfield(){const g=new THREE.BufferGeometry();const v=[];for(let i=0;i<10000;i++)v.push((Math.random()-0.5)*200,(Math.random()-0.5)*200,(Math.random()-0.5)*200);g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:0.1})))}

function createEarth(){const g=new THREE.SphereGeometry(0.25,32,32);const m=new THREE.MeshPhongMaterial({color:0x3498db,emissive:0x3498db,emissiveIntensity:0.4});const e=new THREE.Mesh(g,m);e.userData={name:'Earth',type:'planet'};scene.add(e);planets['Earth']=e}

function createPlanets(){Object.entries(planetsData).forEach(([n,d])=>{const g=new THREE.SphereGeometry(d.size,32,32);const m=new THREE.MeshPhongMaterial({color:d.color,emissive:d.emissive,emissiveIntensity:d.emissiveIntensity});const p=new THREE.Mesh(g,m);p.userData={name:n,type:'planet',data:d};if(n==='Sun'){const gg=new THREE.SphereGeometry(d.size*1.3,32,32);const mm=new THREE.MeshBasicMaterial({color:0xFDB813,transparent:true,opacity:0.5});p.add(new THREE.Mesh(gg,mm))}if(n==='Saturn'){const rg=new THREE.RingGeometry(d.size*1.5,d.size*2.2,64);const rm=new THREE.MeshBasicMaterial({color:0xFAD5A5,side:THREE.DoubleSide,transparent:true,opacity:0.7});const r=new THREE.Mesh(rg,rm);r.rotation.x=Math.PI/2;p.add(r)}scene.add(p);planets[n]=p})}

function raDecToCartesian(ra,dec,dist){const raR=ra*Math.PI/180;const decR=dec*Math.PI/180;return{x:dist*Math.cos(decR)*Math.cos(raR),y:dist*Math.sin(decR),z:dist*Math.cos(decR)*Math.sin(raR)}}

function getLiveStarPosition(ra,dec,dist){const now=new Date();const h=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;const adjRA=(ra+h*15)%360;return raDecToCartesian(adjRA,dec,dist)}

function createStars(){Object.entries(starsData).forEach(([n,d])=>{const g=new THREE.SphereGeometry(d.size,32,32);const m=new THREE.MeshPhongMaterial({color:d.color,emissive:d.color,emissiveIntensity:0.8});const s=new THREE.Mesh(g,m);s.userData={name:n,type:'star',data:d};const gg=new THREE.SphereGeometry(d.size*1.5,32,32);const mm=new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:0.3});s.add(new THREE.Mesh(gg,mm));scene.add(s);stars[n]=s;const pos=getLiveStarPosition(d.ra,d.dec,d.distance);s.position.set(pos.x,pos.y,pos.z)})}

function createOrbitLines(){Object.entries(planetsData).forEach(([n,d])=>{const pts=[];for(let i=0;i<=128;i++){const a=(i/128)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.distance,0,Math.sin(a)*d.distance))}const g=new THREE.BufferGeometry().setFromPoints(pts);const m=new THREE.LineBasicMaterial({color:d.color,transparent:true,opacity:0.3});const l=new THREE.Line(g,m);scene.add(l);orbitLines.push(l)})}

function getCurrentAngle(n){const d=planetsData[n];const elapsed=(Date.now()-startTime)/1000;const days=(elapsed/86400)*animationSpeed;const orbits=days/d.period;return(d.startAngle+(orbits*360))%360}

function updatePlanets(){Object.entries(planets).forEach(([n,p])=>{if(n==='Earth'){p.rotation.y+=0.005;return}const d=planetsData[n];const angle=getCurrentAngle(n)*Math.PI/180;p.position.x=Math.cos(angle)*d.distance;p.position.z=Math.sin(angle)*d.distance;p.rotation.y+=0.01})}

function updateStars(){Object.entries(stars).forEach(([n,s])=>{const d=starsData[n];const pos=getLiveStarPosition(d.ra,d.dec,d.distance);s.position.set(pos.x,pos.y,pos.z)})}

function animate(){requestAnimationFrame(animate);updatePlanets();updateStars();document.getElementById('time-display').textContent=new Date().toLocaleTimeString();renderer.render(scene,camera)}

function setupControls(){let isDragging=false;let prev={x:0,y:0};let rot={x:0,y:0};renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0){isDragging=true;prev={x:e.clientX,y:e.clientY}}});renderer.domElement.addEventListener('mousemove',e=>{if(isDragging){const dx=e.clientX-prev.x;const dy=e.clientY-prev.y;rot.y+=dx*0.005;rot.x+=dy*0.005;rot.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,rot.x));prev={x:e.clientX,y:e.clientY};updateCameraPosition()}});renderer.domElement.addEventListener('mouseup',()=>{isDragging=false});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();const dist=camera.position.length();const newDist=dist+(e.deltaY>0?0.1:-0.1)*dist*0.1;if(newDist>5&&newDist<100)camera.position.multiplyScalar(newDist/dist)});function updateCameraPosition(){const dist=camera.position.length();camera.position.x=dist*Math.sin(rot.y)*Math.cos(rot.x);camera.position.y=dist*Math.sin(rot.x);camera.position.z=dist*Math.cos(rot.y)*Math.cos(rot.x);camera.lookAt(0,0,0)}}

function setupFOVControl(){const slider=document.getElementById('fov-slider');slider.addEventListener('input',e=>{camera.fov=e.target.value;camera.updateProjectionMatrix();document.getElementById('fov-value').textContent=e.target.value+'°'})}

function setupSearch(){const input=document.getElementById('search-input');input.addEventListener('input',e=>{const query=e.target.value.toLowerCase();const all={...planets,...stars};let found=null;for(const[n,obj]of Object.entries(all)){if(n.toLowerCase().includes(query)){found=obj;break}}if(found&&query.length>0)showObjectInfo(found.userData)})}

function populateObjectsList(){const pList=document.getElementById('planets-list');['Earth','Moon','Sun','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'].forEach(n=>{const btn=document.createElement('button');btn.className='object-btn';btn.textContent=getEmoji(n)+' '+n;btn.onclick=()=>focusObject(n);pList.appendChild(btn)});const sList=document.getElementById('stars-list');Object.keys(starsData).forEach(n=>{const btn=document.createElement('button');btn.className='object-btn';btn.textContent='✨ '+n;btn.onclick=()=>focusObject(n);sList.appendChild(btn)})}

function focusObject(n){const obj=planets[n]||stars[n];if(obj)showObjectInfo(obj.userData)}

function onWindowResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)}

function onMouseMove(e){mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1}

function onObjectClick(){raycaster.setFromCamera(mouse,camera);const allObj=[...Object.values(planets),...Object.values(stars)];const intersects=raycaster.intersectObjects(allObj);if(intersects.length>0&&intersects[0].object.userData.name)showObjectInfo(intersects[0].object.userData)}

function showObjectInfo(userData){const n=userData.name;const t=userData.type;if(t==='star')showStarInfo(n,userData.data);else showPlanetInfo(n)}

function showStarInfo(n,d){document.getElementById('planet-name').textContent='✨ '+n.toUpperCase();const grid=document.getElementById('info-grid');grid.innerHTML=`<div class="info-item"><strong>Type</strong>${d.spectralType}</div><div class="info-item"><strong>Distance from Earth</strong>${d.fromEarthLY} ly</div><div class="info-item"><strong>Distance (km)</strong>${(d.fromEarthKM/1000000000000).toFixed(2)} trillion km</div><div class="info-item"><strong>Magnitude</strong>${d.magnitude}</div><div class="info-item"><strong>Mass</strong>${d.mass}</div><div class="info-item"><strong>Temperature</strong>${d.temperature}K</div><div class="info-item"><strong>Luminosity</strong>${d.luminosity}</div><div class="info-item"><strong>RA</strong>${d.ra.toFixed(2)}°</div><div class="info-item"><strong>Dec</strong>${d.dec.toFixed(2)}°</div><div class="info-item"><strong>Constellation</strong>${d.constellation}</div>`;document.getElementById('planet-fact').textContent=planetFacts[n]||'Fascinating star!'}

function showPlanetInfo(n){const d=planetsData[n]||{};const currentAngle=n!=='Earth'?getCurrentAngle(n):0;document.getElementById('planet-name').textContent=getEmoji(n)+' '+n.toUpperCase();const grid=document.getElementById('info-grid');if(n==='Earth'){grid.innerHTML=`<div class="info-item"><strong>Type</strong>Terrestrial</div><div class="info-item"><strong>Position</strong>Center (0 AU)</div><div class="info-item"><strong>Distance from Earth</strong>0 km (You are here!)</div><div class="info-item"><strong>Radius</strong>6,371 km</div><div class="info-item"><strong>Rotation</strong>24 hours</div><div class="info-item"><strong>Mass</strong>5.972×10²⁴ kg</div><div class="info-item"><strong>Gravity</strong>9.81 m/s²</div><div class="info-item"><strong>Temp</strong>15°C avg</div><div class="info-item"><strong>Atmosphere</strong>78% N₂, 21% O₂</div>`}else{grid.innerHTML=`<div class="info-item"><strong>Type</strong>${d.type}</div><div class="info-item"><strong>Distance from Earth</strong>${d.fromEarthAU} AU</div><div class="info-item"><strong>Distance (km)</strong>${(d.fromEarthKM/1000000).toFixed(1)}M km</div><div class="info-item"><strong>Current Angle</strong>${currentAngle.toFixed(1)}°</div><div class="info-item"><strong>Orbital Period</strong>${d.period.toFixed(1)} days</div><div class="info-item"><strong>Radius</strong>${d.radius.toLocaleString()} km</div><div class="info-item"><strong>Mass</strong>${d.mass}</div><div class="info-item"><strong>Gravity</strong>${d.gravity} m/s²</div><div class="info-item"><strong>Temp</strong>${d.temperature}°C avg</div><div class="info-item"><strong>Rotation</strong>${d.rotationPeriod} days</div><div class="info-item"><strong>Moons</strong>${d.moons}</div><div class="info-item"><strong>Atmosphere</strong>${d.atmosphere}</div>`}document.getElementById('planet-fact').textContent=planetFacts[n]||'Fascinating celestial body!'}

function toggleOrbits(){showOrbits=!showOrbits;orbitLines.forEach(l=>l.visible=showOrbits);const btn=document.getElementById('orbit-btn');btn.textContent=showOrbits?'ORBITS ON':'ORBITS OFF';btn.classList.toggle('active',showOrbits)}

function toggleStars(){showStars=!showStars;Object.values(stars).forEach(s=>s.visible=showStars);const btn=document.getElementById('stars-btn');btn.textContent=showStars?'STARS ON':'STARS OFF';btn.classList.toggle('active',showStars)}

function resetCamera(){camera.position.set(0,20,30);camera.lookAt(0,0,0);camera.fov=60;camera.updateProjectionMatrix();document.getElementById('fov-slider').value=60;document.getElementById('fov-value').textContent='60°'}

function getEmoji(n){const emojis={Sun:'⭐',Mercury:'☿️',Venus:'♀️',Earth:'🌍',Mars:'♂️',Jupiter:'♃',Saturn:'♄',Uranus:'♅',Neptune:'♆',Moon:'🌙'};return emojis[n]||'🪐'}

init();
    </script>
</body>
</html>
